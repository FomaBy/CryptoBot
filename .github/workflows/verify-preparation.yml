name: Verify preparation
on:
  pull_request:
  push:
    branches: [main, codex/research-plan]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify skills, documentation and tracked paths
        run: python3 scripts/verify_workspace.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
